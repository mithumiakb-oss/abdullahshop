<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন প্যানেল — AbdullahShop.com</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0F1B3D; --emerald:#2F6FED; --gold:#FF7A29; --gold-dark:#E85D0A;
    --paper:#F3F6FD; --paper-2:#E4EBFB; --ink:#101828; --ink-soft:#57607A; --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:'Hind Siliguri', sans-serif;}
  h1,h2{font-family:'Baloo Da 2', sans-serif; color:var(--forest);}

  .login-wrap{
    max-width:360px; margin:120px auto; background:var(--white); padding:36px; border-radius:18px;
    box-shadow:0 10px 30px rgba(15,27,61,.1); text-align:center;
  }
  .login-wrap input{
    width:100%; padding:12px 14px; border:2px solid var(--paper-2); border-radius:10px; margin:16px 0;
    font-family:'Hind Siliguri'; font-size:1rem;
  }
  .login-wrap button, .btn{
    background:var(--forest); color:var(--white); font-weight:700; padding:12px 24px; border:none;
    border-radius:999px; font-family:'Hind Siliguri'; font-size:.95rem; cursor:pointer;
  }
  .login-wrap button{width:100%;}
  .err-msg{color:#C0392B; font-size:.9rem; margin-top:10px; display:none;}

  #adminApp{display:none; max-width:900px; margin:0 auto; padding:30px 20px 80px;}
  .top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
  .btn-secondary{background:var(--paper-2); color:var(--forest);}

  .card-box{background:var(--white); border-radius:16px; padding:26px; margin-bottom:26px; box-shadow:0 4px 18px rgba(15,27,61,.06);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block; font-weight:600; font-size:.88rem; color:var(--forest); margin-bottom:6px;}
  input, textarea{
    width:100%; padding:10px 12px; border:2px solid var(--paper-2); border-radius:10px;
    font-family:'Hind Siliguri'; font-size:.92rem; color:var(--ink);
  }
  textarea{min-height:70px; resize:vertical;}

  table{width:100%; border-collapse:collapse; margin-top:10px;}
  th, td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--paper-2); font-size:.9rem;}
  th{color:var(--ink-soft); font-weight:600;}
  .row-actions button{
    border:none; background:none; cursor:pointer; font-weight:700; font-size:.85rem; margin-right:10px;
  }
  .edit-btn{color:var(--emerald);}
  .delete-btn{color:#C0392B;}
  .status-msg{margin-top:12px; font-weight:600; font-size:.9rem; display:none;}
  .status-msg.ok{color:var(--emerald);}
  .status-msg.error{color:#C0392B;}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <h1>অ্যাডমিন লগইন</h1>
  <p style="color:var(--ink-soft); margin-top:8px; font-size:.9rem;">পণ্য ম্যানেজ করতে পাসওয়ার্ড দিন</p>
  <input type="password" id="adminKeyInput" placeholder="অ্যাডমিন পাসওয়ার্ড">
  <button id="loginBtn">লগইন করুন</button>
  <p class="err-msg" id="loginErr">ভুল পাসওয়ার্ড — আবার চেষ্টা করুন।</p>
</div>

<div id="adminApp">
  <div class="top-bar">
    <h1>পণ্য ম্যানেজমেন্ট</h1>
    <a href="index.html" class="btn btn-secondary">সাইটে ফিরে যান</a>
  </div>

  <div class="card-box">
    <h2 id="formTitle" style="font-size:1.1rem; margin-bottom:16px;">নতুন পণ্য যোগ করুন</h2>
    <form id="productForm">
      <input type="hidden" id="prodIdOriginal">
      <div class="form-grid">
        <div>
          <label>পণ্যের আইডি (ইউনিক, ইংরেজিতে — যেমন: water-dispenser)</label>
          <input type="text" id="prodId" required>
        </div>
        <div>
          <label>পণ্যের নাম</label>
          <input type="text" id="prodName" required>
        </div>
        <div>
          <label>দাম (টাকা)</label>
          <input type="number" id="prodPrice" required>
        </div>
        <div>
          <label>ট্যাগ (যেমন: বেস্ট সেলার / নতুন / ফিচার্ড)</label>
          <input type="text" id="prodTag">
        </div>
        <div class="full">
          <label>ছবির ফাইলের নাম (GitHub এ আপলোড করা, যেমন: water-dispenser.jpg)</label>
          <input type="text" id="prodImg" required>
        </div>
        <div class="full">
          <label>বিবরণ</label>
          <textarea id="prodDesc" required></textarea>
        </div>
      </div>
      <div style="margin-top:18px; display:flex; gap:12px;">
        <button type="submit" class="btn">সংরক্ষণ করুন</button>
        <button type="button" class="btn btn-secondary" id="clearFormBtn">ফর্ম খালি করুন</button>
      </div>
      <p class="status-msg" id="formStatus"></p>
    </form>
  </div>

  <div class="card-box">
    <h2 style="font-size:1.1rem; margin-bottom:16px;">সব পণ্য</h2>
    <table id="productsTable">
      <thead>
        <tr><th>নাম</th><th>দাম</th><th>ট্যাগ</th><th>ছবি</th><th>অ্যাকশন</th></tr>
      </thead>
      <tbody id="productsTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const ADMIN_KEY_STORAGE = 'abdullahshop_admin_key';
  let adminKey = sessionStorage.getItem(ADMIN_KEY_STORAGE) || '';

  const loginWrap = document.getElementById('loginWrap');
  const adminApp = document.getElementById('adminApp');

  function showApp(){
    loginWrap.style.display = 'none';
    adminApp.style.display = 'block';
    loadProducts();
  }

  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const key = document.getElementById('adminKeyInput').value;
    // Try a harmless POST to verify the key against the server
    const res = await fetch('/api/products', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'X-Admin-Key': key},
      body: JSON.stringify({ action:'__check__' })
    });
    if(res.status === 401){
      document.getElementById('loginErr').style.display = 'block';
    } else {
      adminKey = key;
      sessionStorage.setItem(ADMIN_KEY_STORAGE, key);
      showApp();
    }
  });

  if(adminKey){ showApp(); }

  async function loadProducts(){
    const res = await fetch('/api/products');
    const products = await res.json();
    const tbody = document.getElementById('productsTableBody');
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>${p.name}</td>
        <td>৳${p.price}</td>
        <td>${p.tag || ''}</td>
        <td>${p.img}</td>
        <td class="row-actions">
          <button class="edit-btn" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>এডিট</button>
          <button class="delete-btn" data-id="${p.id}">ডিলিট</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" style="color:var(--ink-soft);">কোনো পণ্য নেই।</td></tr>';

    tbody.querySelectorAll('.delete-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('এই পণ্যটি ডিলিট করতে চান?')) return;
        await apiCall({ action:'delete', id: btn.dataset.id });
        loadProducts();
      });
    });
  }

  function editProduct(p){
    document.getElementById('formTitle').textContent = 'পণ্য সম্পাদনা করুন';
    document.getElementById('prodIdOriginal').value = p.id;
    document.getElementById('prodId').value = p.id;
    document.getElementById('prodName').value = p.name;
    document.getElementById('prodPrice').value = p.price;
    document.getElementById('prodTag').value = p.tag || '';
    document.getElementById('prodImg').value = p.img;
    document.getElementById('prodDesc').value = p.desc || '';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  window.editProduct = editProduct;

  document.getElementById('clearFormBtn').addEventListener('click', ()=>{
    document.getElementById('productForm').reset();
    document.getElementById('prodIdOriginal').value = '';
    document.getElementById('formTitle').textContent = 'নতুন পণ্য যোগ করুন';
  });

  async function apiCall(payload){
    const res = await fetch('/api/products', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'X-Admin-Key': adminKey},
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  document.getElementById('productForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const product = {
      id: document.getElementById('prodId').value.trim(),
      name: document.getElementById('prodName').value.trim(),
      price: parseInt(document.getElementById('prodPrice').value, 10),
      tag: document.getElementById('prodTag').value.trim(),
      img: document.getElementById('prodImg').value.trim(),
      desc: document.getElementById('prodDesc').value.trim()
    };
    const result = await apiCall({ action:'save', product });
    const statusEl = document.getElementById('formStatus');
    if(result.success){
      statusEl.textContent = '✓ সংরক্ষণ হয়েছে!';
      statusEl.className = 'status-msg ok';
      document.getElementById('productForm').reset();
      document.getElementById('prodIdOriginal').value = '';
      document.getElementById('formTitle').textContent = 'নতুন পণ্য যোগ করুন';
      loadProducts();
    } else {
      statusEl.textContent = 'সমস্যা হয়েছে, আবার চেষ্টা করুন।';
      statusEl.className = 'status-msg error';
    }
    statusEl.style.display = 'block';
    setTimeout(()=>{ statusEl.style.display = 'none'; }, 3000);
  });
</script>

</body>
</html>
