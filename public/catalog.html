<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পণ্য ক্যাটালগ ও মূল্য তালিকা — AbdullahShop.com</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0F1B3D; --emerald:#2F6FED; --gold:#FF7A29; --gold-dark:#E85D0A;
    --paper:#F3F6FD; --paper-2:#E4EBFB; --ink:#101828; --ink-soft:#57607A; --line:#dde3f0;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:'Hind Siliguri', sans-serif; line-height:1.5;
       -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  a{color:inherit; text-decoration:none;}
  h1,h2{font-family:'Baloo Da 2', sans-serif; color:var(--forest);}

  /* ---------- উপরের কন্ট্রোল (প্রিন্টে আসে না) ---------- */
  .toolbar{max-width:900px; margin:0 auto; padding:18px 18px 8px;}
  .toolbar .row{display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; margin-bottom:12px;}
  .toolbar label{font-size:.88rem; font-weight:600; color:var(--forest); display:flex; align-items:center; gap:6px;}
  .toolbar select, .toolbar input[type=text]{
    padding:8px 10px; border:2px solid var(--paper-2); border-radius:10px; font-family:inherit; font-size:.9rem; background:#fff;
  }
  .toolbar input[type=text]{flex:1 1 280px; min-width:0;}
  .btn{
    background:var(--forest); color:#fff; font-weight:700; padding:11px 22px; border:none; border-radius:999px;
    font-family:inherit; font-size:.95rem; cursor:pointer;
  }
  .btn-secondary{background:var(--paper-2); color:var(--forest);}
  .hint{font-size:.84rem; color:var(--ink-soft);}
  .top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .top h1{font-size:1.2rem;}

  /* ---------- কাগজ ---------- */
  .sheet{
    max-width:900px; margin:8px auto 40px; background:#fff; padding:28px 28px 34px;
    box-shadow:0 6px 24px rgba(15,27,61,.10); border-radius:6px;
  }
  .s-head{display:flex; align-items:center; gap:14px; padding-bottom:14px; border-bottom:3px solid var(--forest); margin-bottom:6px;}
  .s-head svg{width:52px; height:52px; flex-shrink:0;}
  .s-brand{font-family:'Baloo Da 2', sans-serif; font-size:1.7rem; font-weight:700; color:var(--forest); line-height:1.1;}
  .s-brand span{color:var(--emerald);}
  .s-title{font-size:1rem; font-weight:600; color:var(--ink-soft);}
  .s-date{margin-left:auto; text-align:right; font-size:.85rem; color:var(--ink-soft); white-space:nowrap;}
  .s-contact{font-size:.88rem; color:var(--ink); margin-top:8px;}
  .s-note{font-size:.84rem; color:var(--ink-soft); margin-top:2px;}

  .cat-title{
    font-size:1.15rem; margin:22px 0 10px; padding:6px 12px; background:var(--forest); color:#fff;
    border-radius:8px; display:flex; justify-content:space-between; align-items:baseline;
    break-after:avoid; page-break-after:avoid;
  }
  .cat-title small{font-family:'Hind Siliguri'; font-weight:500; font-size:.8rem; opacity:.85;}

  /* কার্ড ধরন */
  .c-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;}
  .c-card{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; break-inside:avoid; page-break-inside:avoid;}
  .c-img{aspect-ratio:1/1; background:#fff; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line);}
  .c-img img{width:100%; height:100%; object-fit:contain; display:block;}
  .c-ph{font-size:2.4rem; font-weight:700; color:var(--ink-soft); opacity:.5;}
  .c-body{padding:8px 10px 10px;}
  .c-name{font-weight:700; font-size:.95rem; color:var(--forest); line-height:1.35;}
  .c-desc{font-size:.8rem; color:var(--ink-soft); margin-top:3px; white-space:pre-line;}
  .c-price{margin-top:6px; font-family:'Baloo Da 2', sans-serif; font-weight:700; font-size:1.15rem; color:var(--forest); display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .c-price s{font-family:'Hind Siliguri'; font-weight:400; font-size:.8rem; color:var(--ink-soft);}
  .c-off{background:#E0333F; color:#fff; font-family:'Hind Siliguri'; font-weight:700; font-size:.7rem; padding:1px 8px; border-radius:999px;}

  /* তালিকা ধরন */
  .l-table{width:100%; border-collapse:collapse; font-size:.92rem;}
  .l-table th{background:var(--paper-2); color:var(--forest); text-align:left; padding:7px 10px; font-size:.82rem;}
  .l-table td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .l-table tr{break-inside:avoid; page-break-inside:avoid;}
  .l-table .l-no{width:34px; color:var(--ink-soft);}
  .l-table .l-img{width:64px;}
  .l-table .l-img img, .l-table .l-img .c-ph{width:52px; height:52px; object-fit:contain; display:flex; align-items:center; justify-content:center; font-size:1.3rem; border:1px solid var(--line); border-radius:6px; background:#fff;}
  .l-name{font-weight:700; color:var(--forest);}
  .l-desc{font-size:.8rem; color:var(--ink-soft); white-space:pre-line;}
  .l-price{text-align:right; white-space:nowrap; font-family:'Baloo Da 2', sans-serif; font-weight:700; color:var(--forest);}
  .l-price s{display:block; font-family:'Hind Siliguri'; font-weight:400; font-size:.76rem; color:var(--ink-soft);}

  .empty{padding:50px 10px; text-align:center; color:var(--ink-soft);}
  .s-foot{margin-top:22px; padding-top:10px; border-top:1px dashed var(--line); font-size:.78rem; color:var(--ink-soft); text-align:center;}

  @media (max-width:700px){
    .sheet{padding:18px 14px; margin:6px 8px 30px;}
    .c-grid{grid-template-columns:repeat(2, 1fr);}
    .s-head{flex-wrap:wrap;}
    .s-date{margin-left:0; text-align:left; width:100%;}
  }

  /* ---------- প্রিন্ট / PDF ---------- */
  @page{size:A4; margin:12mm;}
  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .sheet{max-width:none; margin:0; padding:0; box-shadow:none; border-radius:0;}
    .c-grid{grid-template-columns:repeat(3, 1fr); gap:3mm;}
    .c-img{aspect-ratio:5/4;}
    .s-head{flex-wrap:nowrap;}
    .s-date{margin-left:auto; width:auto; text-align:right;}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="top">
    <h1>ক্যাটালগ / মূল্য তালিকা</h1>
    <a href="index.html" class="btn btn-secondary">← সাইটে ফিরে যান</a>
  </div>

  <div class="row">
    <label>ধরন
      <select id="layout">
        <option value="cards">ছবিসহ কার্ড</option>
        <option value="list">সাধারণ তালিকা</option>
      </select>
    </label>
    <label>ক্যাটাগরি
      <select id="catFilter"><option value="">সব ক্যাটাগরি</option></select>
    </label>
    <label><input type="checkbox" id="optImg" checked> ছবি</label>
    <label><input type="checkbox" id="optDesc"> বিবরণ</label>
  </div>

  <div class="row">
    <label style="flex:1 1 100%;">যোগাযোগের লাইন
      <input type="text" id="metaContact">
    </label>
    <label style="flex:1 1 100%;">নোট (ডেলিভারি ইত্যাদি)
      <input type="text" id="metaNote">
    </label>
  </div>

  <div class="row">
    <button type="button" class="btn" id="printBtn">PDF হিসেবে সংরক্ষণ করুন</button>
    <span class="hint">বাটন চাপলে প্রিন্ট উইন্ডো খুলবে। সেখানে প্রিন্টার হিসেবে <b>"PDF হিসেবে সংরক্ষণ" (Save as PDF)</b> বেছে নিয়ে সেভ করুন।</span>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="empty">লোড হচ্ছে...</div>
</div>

<script>
  // ডিফল্ট লেখা — উপরের ঘর থেকেও বদলানো যায় (ব্রাউজারে মনে রাখে)
  const DEFAULTS = {
    contact: 'ফোন: ০১৭৬৬১০০৭০৯  •  ইমেইল: infoabdullahshop@gmail.com  •  ওয়েবসাইট: ' + window.location.host,
    note: 'ডেলিভারি চার্জ: ঢাকার ভেতরে ৳৬০, ঢাকার বাইরে ৳১২০'
  };
  const META_KEY = 'abdullahshop_catalog_meta';

  const $ = id => document.getElementById(id);
  let products = [];
  let categories = [];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // বাংলা অঙ্ক ও লাখ-হাজারের কমা (১,২৫,০০০)
  const BN = '০১২৩৪৫৬৭৮৯';
  const bn = s => String(s).replace(/\d/g, d => BN[d]);
  function groupBD(n){
    let s = String(Math.abs(Math.round(Number(n) || 0)));
    if(s.length > 3){
      const last = s.slice(-3);
      const rest = s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      s = rest + ',' + last;
    }
    return s;
  }
  const taka = n => '৳' + bn(groupBD(n));

  const imgOf = p => (p.images && p.images[0]) || p.img || '';

  function loadMeta(){
    let m = {};
    try{ m = JSON.parse(localStorage.getItem(META_KEY) || '{}'); }catch(err){}
    $('metaContact').value = m.contact != null ? m.contact : DEFAULTS.contact;
    $('metaNote').value = m.note != null ? m.note : DEFAULTS.note;
  }
  function saveMeta(){
    try{ localStorage.setItem(META_KEY, JSON.stringify({ contact: $('metaContact').value, note: $('metaNote').value })); }catch(err){}
  }

  // ক্যাটাগরি অনুযায়ী গ্রুপ (অ্যাডমিনের ক্যাটাগরির ক্রম ধরে; ক্যাটাগরিহীন পণ্য শেষে)
  function buildGroups(){
    const order = categories.map(c => c.name);
    products.forEach(p => {
      const c = (p.category || '').trim();
      if(c && !order.includes(c)) order.push(c);
    });
    const groups = [];
    order.forEach(name => {
      const items = products.filter(p => (p.category || '').trim() === name);
      if(items.length) groups.push({ name, items });
    });
    const rest = products.filter(p => !(p.category || '').trim());
    if(rest.length) groups.push({ name: groups.length ? 'অন্যান্য' : 'সব পণ্য', items: rest });
    return groups;
  }

  function fillCategoryFilter(){
    const sel = $('catFilter');
    const keep = sel.value;
    sel.innerHTML = '<option value="">সব ক্যাটাগরি</option>' +
      buildGroups().map(g => `<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('');
    sel.value = keep;
  }

  function priceHTML(p, mode){
    const has = p.originalPrice && p.originalPrice > p.price;
    const pct = has ? Math.round((1 - p.price / p.originalPrice) * 100) : 0;
    if(mode === 'list'){
      return `${has ? `<s>${taka(p.originalPrice)}</s>` : ''}${taka(p.price)}`;
    }
    return `${taka(p.price)}${has ? ` <s>${taka(p.originalPrice)}</s> <span class="c-off">-${bn(pct)}%</span>` : ''}`;
  }

  function imgHTML(p){
    const src = imgOf(p);
    return src
      ? `<img src="${esc(src)}" alt="${esc(p.name)}">`
      : `<span class="c-ph">${esc((p.name || '?').charAt(0))}</span>`;
  }

  function render(){
    const layout = $('layout').value;
    const showImg = $('optImg').checked;
    const showDesc = $('optDesc').checked;
    const only = $('catFilter').value;
    const groups = buildGroups().filter(g => !only || g.name === only);

    const today = new Date();
    const dateStr = bn(today.getDate()) + '/' + bn(today.getMonth() + 1) + '/' + bn(today.getFullYear());
    const contact = $('metaContact').value.trim();
    const note = $('metaNote').value.trim();
    const total = groups.reduce((s, g) => s + g.items.length, 0);

    let html = `
      <div class="s-head">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5B93FF"/><stop offset="100%" stop-color="#0F1B3D"/></linearGradient></defs>
          <path d="M35 30 Q35 12 50 12 Q65 12 65 30" fill="none" stroke="#2F6FED" stroke-width="6" stroke-linecap="round"/>
          <path d="M22 32 L78 32 L72 88 L28 88 Z" fill="url(#cg)"/>
          <path d="M22 32 L50 32 L45 88 L28 88 Z" fill="#5B93FF" opacity="0.5"/>
          <text x="50" y="70" font-family="Baloo Da 2, sans-serif" font-size="42" font-weight="700" fill="#F3F6FD" text-anchor="middle">A</text>
        </svg>
        <div>
          <div class="s-brand">Abdullah<span>Shop</span>.com</div>
          <div class="s-title">পণ্য ক্যাটালগ ও মূল্য তালিকা</div>
        </div>
        <div class="s-date">তারিখ: ${dateStr}<br>মোট পণ্য: ${bn(total)}টি</div>
      </div>
      ${contact ? `<div class="s-contact">${esc(contact)}</div>` : ''}
      ${note ? `<div class="s-note">${esc(note)}</div>` : ''}`;

    if(!groups.length){
      html += '<div class="empty">দেখানোর মতো কোনো পণ্য নেই।</div>';
    }

    groups.forEach(g => {
      html += `<h2 class="cat-title"><span>${esc(g.name)}</span><small>${bn(g.items.length)}টি পণ্য</small></h2>`;
      if(layout === 'cards'){
        html += '<div class="c-grid">' + g.items.map(p => `
          <div class="c-card">
            ${showImg ? `<div class="c-img">${imgHTML(p)}</div>` : ''}
            <div class="c-body">
              <div class="c-name">${esc(p.name)}</div>
              ${showDesc && p.desc ? `<div class="c-desc">${esc(p.desc)}</div>` : ''}
              <div class="c-price">${priceHTML(p, 'cards')}</div>
            </div>
          </div>`).join('') + '</div>';
      } else {
        html += `<table class="l-table"><thead><tr>
            <th class="l-no">#</th>${showImg ? '<th class="l-img"></th>' : ''}<th>পণ্য</th><th style="text-align:right;">দাম</th>
          </tr></thead><tbody>` + g.items.map((p, i) => `
          <tr>
            <td class="l-no">${bn(i + 1)}</td>
            ${showImg ? `<td class="l-img">${imgHTML(p)}</td>` : ''}
            <td><div class="l-name">${esc(p.name)}</div>${showDesc && p.desc ? `<div class="l-desc">${esc(p.desc)}</div>` : ''}</td>
            <td class="l-price">${priceHTML(p, 'list')}</td>
          </tr>`).join('') + '</tbody></table>';
      }
    });

    html += `<div class="s-foot">${esc(window.location.host)} — দাম পরিবর্তনযোগ্য, অর্ডারের আগে নিশ্চিত হয়ে নিন।</div>`;
    $('sheet').innerHTML = html;
  }

  async function load(){
    try{
      const [pr, cr] = await Promise.all([
        fetch('/api/products'),
        fetch('/api/categories').catch(() => null)
      ]);
      const p = await pr.json();
      products = Array.isArray(p) ? p : [];
      try{ const c = cr ? await cr.json() : []; categories = Array.isArray(c) ? c : []; }catch(err){ categories = []; }
    }catch(err){
      products = []; categories = [];
    }
    fillCategoryFilter();
    render();
  }

  ['layout','catFilter','optImg','optDesc'].forEach(id => $(id).addEventListener('change', render));
  ['metaContact','metaNote'].forEach(id => $(id).addEventListener('input', ()=>{ saveMeta(); render(); }));

  // PDF: ছবি ও ফন্ট পুরো লোড হওয়ার পর প্রিন্ট উইন্ডো খোলে; ফাইলের নাম হবে তারিখসহ
  $('printBtn').addEventListener('click', async ()=>{
    const imgs = [...document.querySelectorAll('#sheet img')];
    await Promise.all(imgs.map(i => i.complete ? Promise.resolve() : new Promise(r => { i.onload = i.onerror = r; })));
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(err){} }
    const oldTitle = document.title;
    const d = new Date();
    document.title = 'AbdullahShop-Catalog-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    window.addEventListener('afterprint', ()=>{ document.title = oldTitle; }, { once: true });
    window.print();
  });

  loadMeta();
  load();
</script>

</body>
</html>
