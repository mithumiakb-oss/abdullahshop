<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পণ্যের বিবরণ — AbdullahShop.com</title>
<meta name="description" content="AbdullahShop.com — পণ্যের বিস্তারিত তথ্য দেখুন এবং অর্ডার করুন।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0F1B3D;
    --emerald:#2F6FED;
    --emerald-light:#5B93FF;
    --gold:#FF7A29;
    --gold-dark:#E85D0A;
    --paper:#F3F6FD;
    --paper-2:#E4EBFB;
    --ink:#101828;
    --ink-soft:#57607A;
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#fff; color:var(--ink); font-family:'Hind Siliguri', sans-serif; line-height:1.6;}
  a{text-decoration:none; color:inherit;}
  h1,h2,.brand{font-family:'Baloo Da 2', sans-serif;}
  a:focus-visible, button:focus-visible{outline:3px solid var(--gold-dark); outline-offset:2px;}

  header{background:rgba(255,255,255,0.97); border-bottom:1px solid #e9ecf3; position:sticky; top:0; z-index:20;}
  .nav-wrap{max-width:1000px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between;}
  .logo-group{display:flex; align-items:center; gap:10px;}
  .logo-group .brand{font-size:1.4rem; font-weight:700; color:var(--forest);}
  .logo-group .brand span{color:var(--emerald);}
  .cart-icon-btn{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:50%; background:var(--paper-2); border:none; cursor:pointer;
  }
  .cart-icon-btn svg{width:22px; height:22px;}
  .cart-badge{
    position:absolute; top:-4px; right:-4px; background:var(--gold); color:var(--forest);
    font-size:.68rem; font-weight:800; min-width:18px; height:18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  main{max-width:1000px; margin:0 auto; padding:40px 24px 80px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; color:var(--emerald); font-weight:600; margin-bottom:28px;}
  .back-link:hover{text-decoration:underline;}

  .pd-wrap{display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start;}
  /* ছবি: কোনো ফ্রেম/বর্ডার/প্যাডিং নেই, পুরো ছবি বড় করে দেখাবে */
  .pd-image{background:none; border-radius:0; padding:0; min-height:0;}
  .pd-image img{
    display:block; width:100%; height:auto; max-height:80vh; margin:0 auto;
    object-fit:contain; cursor:zoom-in;
  }
  .pd-thumbs{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .pd-thumbs img{
    width:64px; height:64px; object-fit:contain; border-radius:8px; cursor:pointer;
    border:1px solid #e4e7ee; background:#fff; padding:2px;
  }
  .pd-thumbs img.active-thumb{border-color:var(--emerald); box-shadow:0 0 0 1px var(--emerald);}
  .pd-lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:200; display:none;
    align-items:center; justify-content:center; padding:20px; cursor:zoom-out;
  }
  .pd-lightbox.open{display:flex;}
  .pd-lightbox img{max-width:96vw; max-height:92vh; object-fit:contain;}
  .pd-lightbox-close{position:absolute; top:14px; right:16px; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:1.3rem; cursor:pointer;}

  .pd-tag{
    background:var(--gold); color:var(--forest); font-weight:700; font-size:.8rem; padding:6px 16px;
    border-radius:999px; display:inline-block; margin-bottom:16px;
  }
  .pd-info h1{color:var(--forest); font-size:1.9rem; font-weight:700; margin-bottom:14px;}
  .pd-info .pd-desc{color:var(--ink-soft); font-size:1.05rem; line-height:1.8; margin-bottom:22px; white-space:pre-line;}
  .pd-price{font-family:'Baloo Da 2'; font-size:2.1rem; color:var(--forest); font-weight:700; margin-bottom:26px;}
  .pd-price-row{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:26px;}
  .pd-price-row .pd-price{font-size:2.1rem; margin-bottom:0;}
  .pd-original-price{font-size:1.2rem; color:var(--ink-soft); text-decoration:line-through;}
  .pd-discount-pill{
    background:#E0333F; color:var(--white); font-weight:800; font-size:.85rem;
    padding:4px 12px; border-radius:999px;
  }

  .qty-row{display:flex; align-items:center; gap:16px; margin-bottom:24px;}
  .qty-row label{font-weight:600; color:var(--forest);}
  .qty-control{display:flex; align-items:center; gap:14px; background:var(--white); border:2px solid var(--paper-2); border-radius:999px; padding:6px 18px;}
  .qty-control button{width:28px; height:28px; border-radius:50%; border:1px solid var(--paper-2); background:var(--paper); cursor:pointer; font-weight:700; color:var(--forest); font-size:1rem;}
  .qty-control span{min-width:20px; text-align:center; font-weight:700;}

  .pd-btns{display:flex; gap:14px; flex-wrap:wrap;}
  .btn-add-cart{
    background:var(--forest); color:var(--white); font-weight:700; padding:15px 30px;
    border:none; border-radius:999px; font-family:'Hind Siliguri'; font-size:1rem; cursor:pointer;
    box-shadow:0 4px 0 #071026; transition:transform .15s;
  }
  .btn-add-cart:hover{transform:translateY(-2px);}
  .btn-buy-now{
    background:var(--gold); color:var(--forest); font-weight:700; padding:15px 30px;
    border:none; border-radius:999px; font-family:'Hind Siliguri'; font-size:1rem; cursor:pointer;
    box-shadow:0 4px 0 var(--gold-dark); transition:transform .15s;
  }
  .btn-buy-now:hover{transform:translateY(-2px);}
  .view-cart-link{display:inline-block; margin-top:16px; color:var(--emerald); font-weight:700;}
  .view-cart-link:hover{text-decoration:underline;}

  /* একই ক্যাটাগরির বাকি পণ্য */
  .related{margin-top:56px; padding-top:32px; border-top:1px solid #e9ecf3;}
  .related h2{font-size:1.4rem; color:var(--forest); margin-bottom:18px;}
  .rel-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:18px;}
  .rel-card{display:block; background:#fff; border:1px solid #e9ecf3; border-radius:14px; overflow:hidden; transition:.2s;}
  .rel-card:hover{box-shadow:0 8px 20px rgba(15,27,61,.10); transform:translateY(-3px);}
  .rel-img{aspect-ratio:1/1; background:#fff; position:relative;}
  .rel-img img{width:100%; height:100%; object-fit:contain; display:block;}
  .rel-badge{position:absolute; top:8px; right:8px; background:#E0333F; color:#fff; font-weight:800; font-size:.68rem; padding:3px 8px; border-radius:999px;}
  .rel-body{padding:10px 12px 14px;}
  .rel-name{
    font-size:.92rem; font-weight:600; color:var(--forest); line-height:1.35; min-height:2.7em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .rel-price{margin-top:6px; font-family:'Baloo Da 2'; font-weight:700; color:var(--forest); font-size:1.05rem;}
  .rel-price s{font-family:'Hind Siliguri'; font-weight:400; color:var(--ink-soft); font-size:.78rem; margin-left:6px;}
  @media (max-width:800px){ .rel-grid{grid-template-columns:repeat(2, 1fr); gap:10px;} .related{margin-top:36px;} }

  .btn-view-cart{
    border:2px solid var(--forest); color:var(--forest); font-weight:700; padding:13px 26px;
    border-radius:999px; font-size:1rem; background:none; cursor:pointer;
  }
  .btn-view-cart:hover{background:var(--forest); color:var(--white);}
  .added-msg{margin-top:16px; color:var(--emerald); font-weight:700; display:none;}

  .not-found{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .not-found a{color:var(--emerald); font-weight:700;}

  @media (max-width:800px){
    .pd-wrap{grid-template-columns:1fr;}
  }
  @media (max-width:600px){
    .nav-wrap{padding:10px 14px;}
    main{padding:16px 14px 60px;}
    .back-link{margin-bottom:14px;}
    .pd-wrap{gap:18px;}
    .pd-info h1{font-size:1.4rem;}
    .pd-info .pd-desc{font-size:.98rem; margin-bottom:16px;}
    .pd-price, .pd-price-row .pd-price{font-size:1.7rem;}
    .pd-btns{gap:10px;}
    .btn-add-cart, .btn-buy-now{flex:1 1 calc(50% - 5px); padding:14px 8px; text-align:center;}
  }
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo-group">
      <svg width="34" height="34" viewBox="0 0 100 100" role="img" aria-label="AbdullahShop লোগো">
        <defs>
          <linearGradient id="bagGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5B93FF"/>
            <stop offset="100%" stop-color="#0F1B3D"/>
          </linearGradient>
        </defs>
        <path d="M35 30 Q35 12 50 12 Q65 12 65 30" fill="none" stroke="#2F6FED" stroke-width="6" stroke-linecap="round"/>
        <path d="M22 32 L78 32 L72 88 L28 88 Z" fill="url(#bagGrad)"/>
        <path d="M22 32 L50 32 L45 88 L28 88 Z" fill="#5B93FF" opacity="0.5"/>
        <text x="50" y="70" font-family="Baloo Da 2, sans-serif" font-size="42" font-weight="700" fill="#F3F6FD" text-anchor="middle">A</text>
      </svg>
      <span class="brand">Abdullah<span style="color:var(--emerald)">Shop</span>.com</span>
    </a>
    <a href="index.html#order" class="cart-icon-btn" aria-label="কার্ট দেখুন">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0F1B3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
  </div>
</header>

<main id="pdContent">
  <a href="index.html#products" class="back-link">← সব পণ্যে ফিরে যান</a>
  <!-- content injected by JS -->
</main>

<div class="pd-lightbox" id="pdLightbox">
  <button type="button" class="pd-lightbox-close" aria-label="বন্ধ করুন">✕</button>
  <img id="pdLightboxImg" src="" alt="">
</div>

<script>
  const CART_KEY = 'abdullahshop_cart';
  const BUYNOW_KEY = 'abdullahshop_buynow';
  try{ sessionStorage.removeItem(BUYNOW_KEY); }catch(err){}   // পণ্য দেখার সময় পুরনো Buy Now মুছে যায়
  function loadCart(){
    try{ const raw = localStorage.getItem(CART_KEY); return raw ? JSON.parse(raw) : []; }
    catch(err){ return []; }
  }
  function saveCart(cart){
    try{ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }catch(err){}
  }
  function updateCartBadge(){
    const cart = loadCart();
    const total = cart.reduce((s,i)=>s+i.qty, 0);
    document.getElementById('cartBadge').textContent = total;
  }
  function formatTaka(n){ return '৳' + n.toLocaleString('en-US'); }

  // Read ?id= from URL, then fetch that product from the API
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const content = document.getElementById('pdContent');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadProduct(){
    let product = null, list = null;
    try{
      const res = await fetch('/api/products');
      if(res.ok){
        list = await res.json();
        if(Array.isArray(list)) product = list.find(p => p.id === id) || null;
      }
    }catch(err){ /* নিচে একক পণ্যের অনুরোধ দিয়ে চেষ্টা হবে */ }
    if(!product){
      try{
        const res = await fetch('/api/products?id=' + encodeURIComponent(id));
        if(res.ok){ product = await res.json(); }
      }catch(err){ /* leave product as null */ }
    }
    renderProduct(product);
    renderRelated(list, product);
  }

  // নিচে একই ক্যাটাগরির বাকি পণ্য (ক্যাটাগরি না থাকলে বা একা থাকলে অন্য পণ্য)
  function renderRelated(list, product){
    if(!product || !Array.isArray(list)) return;
    const others = list.filter(p => p.id !== product.id);
    const cat = (product.category || '').trim();
    const sameCat = cat ? others.filter(p => (p.category || '').trim() === cat) : [];
    let items, title;
    if(sameCat.length){ items = sameCat; title = esc(cat) + ' ক্যাটাগরির আরও পণ্য'; }
    else if(others.length){ items = others; title = 'আরও পণ্য দেখুন'; }
    else return;

    const cards = items.slice(0, 8).map(p => {
      const img = (p.images && p.images.length) ? p.images[0] : p.img;
      const hasDiscount = p.originalPrice && p.originalPrice > p.price;
      const pct = hasDiscount ? Math.round((1 - p.price / p.originalPrice) * 100) : 0;
      return `
        <a class="rel-card" href="product.html?id=${encodeURIComponent(p.id)}">
          <div class="rel-img">
            ${hasDiscount ? `<span class="rel-badge">-${pct}%</span>` : ''}
            <img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">
          </div>
          <div class="rel-body">
            <div class="rel-name">${esc(p.name)}</div>
            <div class="rel-price">${formatTaka(p.price)}${hasDiscount ? `<s>${formatTaka(p.originalPrice)}</s>` : ''}</div>
          </div>
        </a>`;
    }).join('');

    // insertAdjacentHTML: উপরের বাটনগুলোর ইভেন্ট নষ্ট করে না
    content.insertAdjacentHTML('beforeend', `<section class="related"><h2>${title}</h2><div class="rel-grid">${cards}</div></section>`);
  }

  function renderProduct(product){
  if(!product){
    content.innerHTML += `
      <div class="not-found">
        <h2>পণ্যটি পাওয়া যায়নি</h2>
        <p style="margin-top:10px;">দুঃখিত, এই পণ্যের কোনো তথ্য নেই।</p>
        <p style="margin-top:16px;"><a href="index.html#products">সব পণ্য দেখুন</a></p>
      </div>`;
  } else {
    document.title = product.name + ' — AbdullahShop.com';
    const images = (product.images && product.images.length) ? product.images : [product.img];
    const thumbsHTML = images.length > 1 ? `
          <div class="pd-thumbs">
            ${images.map((img, i) => `<img src="${img}" alt="${product.name} ${i+1}" data-idx="${i}" class="${i===0 ? 'active-thumb' : ''}">`).join('')}
          </div>` : '';
    const hasDiscount = product.originalPrice && product.originalPrice > product.price;
    const discountPct = hasDiscount ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;
    const priceHTML = hasDiscount
      ? `<div class="pd-price-row">
           <span class="pd-price">${formatTaka(product.price)}</span>
           <span class="pd-original-price">${formatTaka(product.originalPrice)}</span>
           <span class="pd-discount-pill">-${discountPct}% ছাড়</span>
         </div>`
      : `<div class="pd-price">${formatTaka(product.price)}</div>`;
    content.innerHTML += `
      <div class="pd-wrap">
        <div>
          <div class="pd-image"><img id="pdMainImg" src="${images[0]}" alt="${product.name}"></div>
          ${thumbsHTML}
        </div>
        <div class="pd-info">
          ${product.tag ? `<span class="pd-tag">${product.tag}</span>` : ''}
          <h1>${product.name}</h1>
          <p class="pd-desc">${product.desc}</p>
          ${priceHTML}
          <div class="qty-row">
            <label>পরিমাণ</label>
            <div class="qty-control">
              <button type="button" id="qtyMinus">−</button>
              <span id="qtyVal">1</span>
              <button type="button" id="qtyPlus">+</button>
            </div>
          </div>
          <div class="pd-btns">
            <button class="btn-buy-now" id="buyNowBtn">এখনই কিনুন</button>
            <button class="btn-add-cart" id="addCartBtn">কার্টে যোগ করুন</button>
          </div>
          <p class="added-msg" id="addedMsg">✓ কার্টে যোগ হয়েছে!</p>
          <a href="index.html#order" class="view-cart-link">কার্ট দেখে অর্ডার করুন →</a>
        </div>
      </div>`;

    // Thumbnail gallery: click a thumbnail to change the main image
    const mainImg = document.getElementById('pdMainImg');
    document.querySelectorAll('.pd-thumbs img').forEach(thumb=>{
      thumb.addEventListener('click', ()=>{
        mainImg.src = thumb.src;
        document.querySelectorAll('.pd-thumbs img').forEach(t=>t.classList.remove('active-thumb'));
        thumb.classList.add('active-thumb');
      });
    });

    // Click the main image to zoom in (lightbox)
    const lightbox = document.getElementById('pdLightbox');
    const lightboxImg = document.getElementById('pdLightboxImg');
    mainImg.addEventListener('click', ()=>{
      lightboxImg.src = mainImg.src;
      lightbox.classList.add('open');
    });
    lightbox.addEventListener('click', ()=> lightbox.classList.remove('open'));

    let qty = 1;
    const qtyVal = document.getElementById('qtyVal');
    document.getElementById('qtyPlus').addEventListener('click', ()=>{
      qty += 1; qtyVal.textContent = qty;
    });
    document.getElementById('qtyMinus').addEventListener('click', ()=>{
      if(qty > 1){ qty -= 1; qtyVal.textContent = qty; }
    });

    document.getElementById('buyNowBtn').addEventListener('click', ()=>{
      const item = { name: product.name, price: product.price, qty: qty };
      let saved = false;
      try{
        sessionStorage.setItem(BUYNOW_KEY, JSON.stringify(item));
        saved = !!sessionStorage.getItem(BUYNOW_KEY);
      }catch(err){}
      if(!saved){   // ব্রাউজার সেশন সেভ না করলে কার্টে যোগ করে অর্ডারে নেওয়া হবে
        const cart = loadCart();
        const existing = cart.find(i => i.name === product.name);
        if(existing){ existing.qty += qty; } else { cart.push(item); }
        saveCart(cart);
      }
      window.location.href = 'index.html#order';
    });

    document.getElementById('addCartBtn').addEventListener('click', ()=>{
      const cart = loadCart();
      const existing = cart.find(i => i.name === product.name);
      if(existing){ existing.qty += qty; } else { cart.push({name: product.name, price: product.price, qty: qty}); }
      saveCart(cart);
      updateCartBadge();
      const msg = document.getElementById('addedMsg');
      msg.style.display = 'block';
      setTimeout(()=>{ msg.style.display = 'none'; }, 2500);
    });
  }
  } // end renderProduct

  loadProduct();
  updateCartBadge();
</script>

</body>
